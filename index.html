<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ReelNest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a quiet cinema lobby. Charcoal room, warm amber marquee light on what to watch next;
   posters carry the colour, chrome stays out of the way. Sidebar on wide screens, glass tab bar on phones. */
:root {
  --bg: #f6f3ee;
  --surface: #ffffff;
  --surface-2: #efe9e1;
  --ink: #1d1a16;
  --ink-muted: #5f574d;
  --line: #ddd4c8;
  --accent: #a35a00;
  --accent-ink: #ffffff;
  --accent-soft: #fbe5c6;
  --good: #1d7a55;
  --warn: #b3261e;
  --glass: rgba(255, 255, 255, 0.78);
  --shadow: 0 1px 2px rgba(40, 28, 10, .06), 0 8px 24px rgba(40, 28, 10, .07);
  --font-display: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-sm: 10px; --r-md: 16px; --r-lg: 22px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121214; --surface: #1b1b1f; --surface-2: #26262b; --ink: #f2ede6;
    --ink-muted: #b5ada3; --line: #34333a; --accent: #ffb547; --accent-ink: #2b1700; --accent-soft: #3d2b12;
    --good: #6fd3a8; --warn: #ffb4ab; --glass: rgba(24, 24, 28, 0.78);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121214; --surface: #1b1b1f; --surface-2: #26262b; --ink: #f2ede6;
  --ink-muted: #b5ada3; --line: #34333a; --accent: #ffb547; --accent-ink: #2b1700; --accent-soft: #3d2b12;
  --good: #6fd3a8; --warn: #ffb4ab; --glass: rgba(24, 24, 28, 0.78);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-muted); }
.small { font-size: 14px; }
.tiny { font-size: 13px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- app shell ---------- */
.shell { display: grid; grid-template-columns: 1fr; min-height: 100%; }
.side { display: none; }
main { padding: 0 16px calc(96px + env(safe-area-inset-bottom)); max-width: 1120px; width: 100%; margin: 0 auto; }
.topbar { display: flex; align-items: center; gap: 12px; padding: calc(16px + env(safe-area-inset-top)) 0 12px; }
.topbar h1 { font-size: 30px; font-weight: 800; flex: 1; }
.tabbar {
  position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 20;
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 6px;
  background: var(--glass); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow);
}
.tab {
  display: grid; justify-items: center; gap: 2px; padding: 8px 2px; border: 0; background: none; border-radius: 18px;
  color: var(--ink-muted); font-size: 12px; font-weight: 600; min-height: 52px;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--ink); background: var(--accent-soft); }
.tab[aria-current="page"] svg { color: var(--accent); }
@media (min-width: 900px) {
  .shell { grid-template-columns: 236px 1fr; }
  .tabbar { display: none; }
  main { padding: 0 32px 48px; }
  .side {
    display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; padding: 28px 16px;
    border-right: 1px solid var(--line); background: var(--surface);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 22px; padding: 0 10px 22px; }
  .side .tab { display: flex; justify-content: flex-start; gap: 12px; font-size: 16px; padding: 10px 12px; min-height: 46px; }
  .side .tab:hover { background: var(--surface-2); color: var(--ink); }
  .side .foot { margin-top: auto; padding: 10px; font-size: 13px; color: var(--ink-muted); }
}

/* ---------- primitives ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { border-color: var(--ink-muted); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--warn); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.icon-btn {
  width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 999px; border: 1px solid transparent;
  background: transparent; color: var(--ink);
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 22px; height: 22px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); font-size: 15px; font-weight: 600; white-space: nowrap;
}
.chip:hover { border-color: var(--ink-muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.wrap-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--surface-2); color: var(--ink-muted); white-space: nowrap;
}
.pill.accent { background: var(--accent-soft); color: var(--ink); }
.pill.demo { background: transparent; border: 1px dashed var(--ink-muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.field { display: grid; gap: 6px; }
.field label { font-weight: 600; font-size: 14px; }
.input {
  width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
}
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.err { border-color: var(--warn); }
.err-text { color: var(--warn); font-size: 13px; }
textarea.input { min-height: 96px; resize: vertical; }
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--ink-muted); }
.search .input { padding-left: 44px; border-radius: 999px; min-height: 50px; font-size: 16px; }
.section { display: grid; gap: 12px; margin-top: 28px; }
.section-head { display: flex; align-items: baseline; gap: 12px; }
.section-head h2 { font-size: 21px; font-weight: 700; flex: 1; }
.link-btn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 6px 4px; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface-2); font-size: 14px; }
.banner.warn { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); }
.progress { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.skeleton { background: var(--surface-2); border-radius: 12px; }
@media (prefers-reduced-motion: no-preference) {
  .skeleton { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .fade-in { animation: fade .22s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
}

/* ---------- posters ---------- */
.poster { position: relative; aspect-ratio: 2/3; border-radius: 14px; overflow: hidden; background: var(--surface-2); flex: none; }
.poster img { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; display: block; }
.poster .ph {
  position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 10%;
  color: #fff; font-family: var(--font-display); font-weight: 800; line-height: 1.05; letter-spacing: -0.01em;
}
.poster .ph .t { font-size: clamp(11px, 2.6cqw + 6px, 22px); text-shadow: 0 1px 8px rgba(0,0,0,.25); overflow-wrap: anywhere; }
.poster .ph .k { font-family: var(--font-body); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .85; margin-bottom: 6px; }
.poster { container-type: inline-size; }
.poster .ph .i { display: none; font-size: 20px; align-self: center; margin: auto 0; }
@container (max-width: 100px) {
  .poster .ph { justify-content: center; align-items: center; padding: 0; }
  .poster .ph .t, .poster .ph .k { display: none; }
  .poster .ph .i { display: block; }
}
.poster .badge { position: absolute; top: 8px; left: 8px; }

/* ---------- home ---------- */
.next-grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 720px) { .next-grid { grid-template-columns: 1fr 1fr; } }
.next-card { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px; }
.next-card .title { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.2; }
.next-card .ep { font-weight: 600; margin-top: 2px; }
.watch-btn {
  width: 56px; height: 56px; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent);
  transition: transform .12s;
}
.watch-btn:hover { transform: scale(1.05); }
.watch-btn:active { transform: scale(.95); }
.watch-btn svg { width: 28px; height: 28px; }
.row-list { display: grid; }
.row { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 10px 6px; border-radius: 14px; border: 0; background: none; text-align: left; width: 100%; }
.row:hover { background: var(--surface-2); }
.row .t { font-weight: 600; }
.shelf { display: grid; grid-auto-flow: column; grid-auto-columns: 128px; gap: 14px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
/* Explicit widths: Safari does not stretch <button> grid items, and a poster with container-type inside a
   shrink-to-fit button collapses to zero width. */
.tile { border: 0; background: none; padding: 0; text-align: left; display: grid; gap: 8px; width: 100%; min-width: 0; }
.next-card > .tile { width: 84px; }
.tile .t { font-weight: 600; font-size: 15px; line-height: 1.3; }
.tile:hover .poster { box-shadow: 0 0 0 3px var(--accent); }
.hero-strip {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 4px;
}
.stat { padding: 14px 16px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); }
.stat b { display: block; font-family: var(--font-display); font-size: 28px; line-height: 1.1; }
.stat span { font-size: 13px; color: var(--ink-muted); font-weight: 600; }

/* ---------- lists / grid ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 18px 14px; }
.result { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; padding: 10px; border-radius: 16px; }
.result:hover { background: var(--surface-2); }
.result .t { font-weight: 700; font-size: 17px; line-height: 1.25; }
.meta-line { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

/* ---------- detail ---------- */
.detail-hero { position: relative; margin: 0 -16px; padding: calc(12px + env(safe-area-inset-top)) 16px 20px; overflow: hidden; }
.detail-hero::before {
  content: ""; position: absolute; inset: 0; background: var(--hero, var(--surface-2)); opacity: .9;
  mask-image: linear-gradient(to bottom, #000 30%, transparent); -webkit-mask-image: linear-gradient(to bottom, #000 30%, transparent);
}
.detail-hero > * { position: relative; }
.detail-hero .backdrop { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .38;
  mask-image: linear-gradient(to bottom, #000 35%, transparent 95%); -webkit-mask-image: linear-gradient(to bottom, #000 35%, transparent 95%); }
:root[data-theme="light"] .detail-hero .backdrop { opacity: .22; }
.tagline { font-style: italic; color: var(--ink-muted); font-size: 17px; }
.score { display: flex; align-items: baseline; gap: 8px; }
.score b { font-family: var(--font-display); font-size: 22px; color: var(--accent); }
.prov-group { display: grid; gap: 8px; }
.prov-label { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted); }
.prov-list { display: flex; flex-wrap: wrap; gap: 8px; }
.prov { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-weight: 600; font-size: 14px; }
.prov-logo { position: relative; width: 28px; height: 28px; border-radius: 7px; overflow: hidden; background: var(--surface-2); flex: none; }
.prov-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.facts { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 8px 18px; margin: 0; }
.facts dt { color: var(--ink-muted); font-weight: 600; font-size: 14px; }
.facts dd { margin: 0; }
a.btn { text-decoration: none; color: inherit; }
.detail-head { display: grid; grid-template-columns: 132px 1fr; gap: 18px; align-items: end; margin-top: 8px; }
@media (min-width: 720px) { .detail-head { grid-template-columns: 180px 1fr; gap: 28px; } .detail-hero { margin: 0 -32px; padding-left: 32px; padding-right: 32px; } }
.detail-head h1 { font-size: clamp(26px, 4vw, 40px); font-weight: 800; line-height: 1.05; }
.detail-cols { display: grid; gap: 20px; }
@media (min-width: 980px) { .detail-cols { grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr); align-items: start; } }
.panel { padding: 18px; display: grid; gap: 16px; }
.panel h3 { font-size: 18px; font-weight: 700; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 14px; }
.seg button { flex: 1 0 auto; border: 0; background: none; padding: 9px 12px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--ink-muted); white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.toggle-row { display: flex; align-items: center; gap: 12px; }
.switch { position: relative; width: 52px; height: 32px; border-radius: 99px; border: 0; background: var(--line); flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { left: 24px; }
.rating { display: flex; gap: 4px; flex-wrap: wrap; }
.rating button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; }
.rating button:hover { border-color: var(--accent); }
.rating button.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.season { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); overflow: hidden; }
.season-head { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; width: 100%; padding: 14px 16px; border: 0; background: none; text-align: left; }
.season-head:hover { background: var(--surface-2); }
.season-head .t { font-weight: 700; font-size: 17px; }
.season-body { border-top: 1px solid var(--line); }
.ep-row { display: grid; grid-template-columns: 44px 1fr auto; gap: 8px; align-items: start; padding: 10px 8px 10px 10px; border-top: 1px solid var(--line); }
.ep-row:first-child { border-top: 0; }
.check {
  width: 36px; height: 36px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; color: transparent;
  transition: background .12s, border-color .12s;
}
.check:hover { border-color: var(--accent); }
.check[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check[disabled] { opacity: .4; cursor: not-allowed; }
.check svg { width: 20px; height: 20px; }
.ep-row .t { font-weight: 600; }
.ep-row.watched .t { color: var(--ink-muted); }
.spoiler { border: 0; background: none; padding: 2px 0; color: var(--accent); font-weight: 600; font-size: 14px; }
.menu { position: relative; }
.menu-pop {
  position: absolute; right: 0; top: 100%; z-index: 30; min-width: 230px; padding: 6px; display: grid;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
}
.menu-pop button { border: 0; background: none; text-align: left; padding: 11px 12px; border-radius: 10px; font-weight: 500; }
.menu-pop button:hover { background: var(--surface-2); }

/* ---------- overlay ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(10, 8, 6, .5); display: grid; align-items: end; justify-items: center; }
@media (min-width: 720px) { .scrim { align-items: center; } }
.sheet {
  width: min(560px, 100%); max-height: 88vh; overflow: auto; background: var(--surface); color: var(--ink);
  border-radius: 26px 26px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom)); display: grid; gap: 16px;
}
@media (min-width: 720px) { .sheet { border-radius: 26px; } }
.sheet h2 { font-size: 22px; font-weight: 800; }
.sheet .actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(100px + env(safe-area-inset-bottom)); z-index: 60;
  display: flex; align-items: center; gap: 14px; max-width: calc(100% - 32px); padding: 12px 12px 12px 18px;
  background: var(--ink); color: var(--bg); border-radius: 16px; box-shadow: var(--shadow); font-weight: 600;
}
@media (min-width: 900px) { .toast { bottom: 28px; left: calc(50% + 118px); } }
.toast button { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 8px 14px; font-weight: 700; }
.toast .x { background: transparent; color: var(--bg); padding: 8px; }
.empty { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 40px 16px; }
.empty h3 { font-size: 22px; font-weight: 800; }
.empty p { max-width: 46ch; margin: 0; color: var(--ink-muted); }
.empty .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
.cal-day { display: grid; gap: 4px; }
.cal-day h3 { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-muted); font-family: var(--font-body); padding: 6px 6px 2px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; }
details summary { cursor: pointer; font-weight: 600; }

.signin { display: grid; gap: 16px; max-width: 440px; }
.gsi-slot { min-height: 44px; display: flex; align-items: center; }
/* Google's button lives in a light-scheme iframe; matching its scheme stops browsers painting a white box behind it on dark pages. */
.gsi-slot iframe { color-scheme: light; background: transparent !important; }
.gsi-slot > div { background: transparent !important; }
.email-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.email-row .btn { min-height: 48px; }
@media (max-width: 380px) { .email-row { grid-template-columns: 1fr; } }
.divider-or { display: flex; align-items: center; gap: 10px; color: var(--ink-muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.divider-or::before, .divider-or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
/* ---------- cast ---------- */
.cast-row { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 116px; gap: 14px; overflow-x: auto; overscroll-behavior-x: contain;

// ---------- utilities ----------

const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "x" + Math.random().toString(36).slice(2) + Date.now().toString(36));
const now = () => Date.now();
const pad = (n) => String(n).padStart(2, "0");
const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
const addDays = (iso, n) => { const [y, m, d] = iso.split("-").map(Number); return isoOf(new Date(y, m - 1, d + n)); };
const validISO = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s + "T00:00:00"));
const fmtDate = (iso) => {
  if (!iso) return "Date unknown";
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
};
const relDay = (iso) => {
  const t = today();
  if (iso === t) return "Today";
  if (iso === addDays(t, 1)) return "Tomorrow";
  if (iso === addDays(t, -1)) return "Yesterday";
  const [y, m, d] = iso.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  const diff = (date - new Date(t + "T00:00:00")) / 86400000;
  if (diff > 0 && diff < 7) return date.toLocaleDateString(undefined, { weekday: "long" });
  return fmtDate(iso);
};

  get(k) { try { return window.localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { window.localStorage.setItem(k, v); return true; } catch { return false; } },

// ======================================================================
//  Domain rules
// ======================================================================
const isSpecial = (e) => e.season === 0;
const epCode = (e) => (isSpecial(e) ? `Special ${e.number}` : `S${pad(e.season)}E${pad(e.number)}`);
const airState = (date, t) => (!date ? "unknown" : date > t ? "upcoming" : "aired");
const epOrder = (a, b) => (isSpecial(a) - isSpecial(b)) || a.season - b.season || a.number - b.number;

function progressOf(eps, watched, t, includeSpecials) {
  let w = 0, total = 0, upcoming = 0, unknown = 0, spW = 0, spT = 0;
  for (const e of eps) {
    if (isSpecial(e)) { spT++; if (watched.has(e.id)) spW++; }
    const a = airState(e.airDate, t);
    if (a === "upcoming") upcoming++; else if (a === "unknown") unknown++;
    if (a === "aired" && (!isSpecial(e) || includeSpecials)) { total++; if (watched.has(e.id)) w++; }
  }
  return { watched: w, total, upcoming, unknown, specialsWatched: spW, specialsTotal: spT, missing: total - w,
    caughtUp: total > 0 && total === w, fraction: total ? w / total : 0 };
}

/** First unwatched episode after the furthest watched one. */
function upNextOf(eps, watched, t, includeSpecials) {
  const ordered = eps.filter((e) => !isSpecial(e) || includeSpecials).sort(epOrder);
  if (!ordered.length) return { kind: "none" };

    d.page = page; d.pages = pages; d.filteredLocally = local;
  } catch (e) { if (seq === discSeq) d.error = e.code || "network"; }
  if (seq === discSeq) { d.loading = false; render(); }
}

let linkTimer = null;
async function linkSearch() {
  const m = UI.modal; if (!m || m.type !== "link") return;
  const w = S.works[m.id];
  m.busy = "Searching…"; m.error = null; render();
  try {
    const r = await Catalog.call(w.type === "MOVIE" ? "search/movie" : "search/tv", { query: m.q.trim(), page: 1, language: S.settings.lang, include_adult: "false" });
    if (UI.modal !== m) return;
    m.items = r.results.map((x) => Catalog.item(x, w.type)).filter(Boolean).slice(0, 12);
  } catch (e) { m.error = Catalog.message(e.code); m.items = []; }

}
async function linkPreview(key) {
  const m = UI.modal, w = S.works[m.id], it = m.items.find((i) => i.key === key);
  m.busy = "Loading the catalog entry and its episodes…"; render();
  try {
    const d = await Catalog.details(it);
    let eps = [];
    for (const s of d.seasons) eps = eps.concat(await Catalog.season(d.work, s.number));
    const manualEps = (S.episodes[m.id] || []).filter((e) => e.isManual);
    const bySlot = new Map(eps.map((e) => [e.season + ":" + e.number, e]));
    const map = {}, kept = [];
    for (const e of manualEps) { const c = bySlot.get(e.season + ":" + e.number); if (c) map[e.id] = c.id; else kept.push(e); }
    const evs = activeEvents(m.id);
    m.preview = { target: d.work, seasons: d.seasons, eps, map, kept, matched: Object.keys(map).length,
      moved: w.type === "SERIES" ? evs.filter((e) => e.episodeId && map[e.episodeId]).length : evs.length, existing: !!S.states[d.work.id] };
  } catch (e) { m.error = Catalog.message(e.code); }
  m.busy = null; render();
}
function applyLink() {
  const m = UI.modal, p = m.preview, oldId = m.id, t = p.target, newId = t.id, w = S.works[oldId], tm = now();
  const existing = S.works[newId];
  S.works[newId] = { ...t, createdAt: Math.min(w.createdAt || tm, existing?.createdAt || tm), isAnime: w.isAnime, updatedAt: tm };
  S.seasons[newId] = p.seasons.map((s) => ({ ...s, fetchedAt: tm }));
  const keptMoved = p.kept.map((e) => ({ ...e, workId: newId, updatedAt: tm }));
  const keepIds = new Set(keptMoved.map((e) => e.id));
  S.episodes[newId] = [...(S.episodes[newId] || []).filter((e) => !keepIds.has(e.id) && !p.eps.some((n) => n.id === e.id)), ...p.eps, ...keptMoved];
  // Watch records: recreated on the catalog title (never lost), old ones closed.
  const already = new Set(activeEvents(newId).map((e) => e.episodeId).filter(Boolean));
  for (const e of activeEvents(oldId)) {
    S.events[e.id] = { ...e, deletedAt: tm };
    const ep = e.episodeId ? (p.map[e.episodeId] || e.episodeId) : null;
    if (ep && already.has(ep)) continue;
    const c = { ...e, id: uuid(), workId: newId, episodeId: ep, createdAt: tm, deletedAt: null, deviceId: DEVICE };
    S.events[c.id] = c;
  }
  // State: copied with fresh timestamps, or combined with the existing catalog entry (both notes kept).
  const mine = S.states[oldId];
  if (mine) {
    const bumped = { ...mine, workId: newId, interestAt: tm, statusAt: tm, watchlistAt: tm, ratingAt: tm, notesAt: tm, deviceId: DEVICE };
    const theirs = S.states[newId];
    let merged = theirs ? mergeState(theirs, bumped).state : bumped;
    if (theirs && theirs.notes && mine.notes && theirs.notes !== mine.notes) merged = { ...merged, notes: theirs.notes + "\n\n" + mine.notes };
    S.states[newId] = { ...merged, addedAt: Math.min(mine.addedAt || tm, theirs?.addedAt || tm) };
    delete S.tombs[newId];
  }
  delete S.states[oldId];
  S.tombs[oldId] = { entityType: "work", entityId: oldId, deletedAt: tm, deviceId: DEVICE };
  Persist.touch(newId); Persist.touch(oldId); Persist.touchMeta();
  delete S.works[oldId]; delete S.episodes[oldId]; delete S.seasons[oldId];
  UI.modal = null; toast(`Linked to “${t.title}”. Your progress was kept.`);
  openDetail(newId);
}

    let rows = "";
    for (let w = 0; w < 6; w++) {
      rows += "<tr>";
      for (let k = 0; k < 7; k++) {
        const dt = new Date(start.getFullYear(), start.getMonth(), start.getDate() + w * 7 + k), iso = isoOf(dt);
        const out = dt.getMonth() !== vm - 1, fut = iso > t, sel = iso === m.date, isT = iso === t;

      }

      if (w >= 4 && new Date(start.getFullYear(), start.getMonth(), start.getDate() + (w + 1) * 7).getMonth() !== vm - 1) break;
    }
    const wk = Array.from({ length: 7 }, (_, i) => new Date(2023, 0, 1 + i)); // a Sunday-first week
    body = `<table class="cal-grid" role="grid" aria-labelledby="cal-title"><thead><tr>${wk.map((d) => `<th scope="col" abbr="${esc(d.toLocaleDateString(undefined, { weekday: "long" }))}">${esc(d.toLocaleDateString(undefined, { weekday: "short" }).slice(0, 3))}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>`;
  }

}

function planImport(b) {

      const edited = st ? Math.max(...FIELDS.map(([, a]) => st[a] || 0)) : 0;
      if (edited <= tomb.deletedAt) { pv.skippedDeleted++; continue; }
    }
    const existing = S.works[w.id];
    const dup = !existing && w.provider && w.providerId ? byProvider[`${w.provider}:${w.type}:${w.providerId}`] : null;

  for (const e of b.episodes) if (map[e.workId]) plan.episodes.push({ ...e, workId: map[e.workId] });
  for (const s of b.states) {
    const id = map[s.workId]; if (!id) continue;
    const incoming = { ...s, workId: id };

function applyImport(p, includeSettings, settings) {

  for (const [id, list] of Object.entries(seasonsBy)) {
    const cur = Object.fromEntries((S.seasons[id] || []).map((s) => [s.number, s]));
    for (const s of list) cur[s.number] = { ...cur[s.number], ...s };
    S.seasons[id] = Object.values(cur); touched.add(id);

  for (const e of p.episodes) {
    const list = S.episodes[e.workId] || (S.episodes[e.workId] = []);

const Gsi = {

      const dark = document.documentElement.dataset.theme === "dark" || (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      google.accounts.id.renderButton(target, { type: "standard", theme: dark ? "filled_black" : "outline", size: "large", text: "continue_with", shape: "pill", logo_alignment: "left", width: Math.max(220, Math.min(400, target.clientWidth || 320)) });

    }
  },
  async done(resp, raw) {
    if (!resp || !resp.credential) return;
    this.raw = null; // a nonce is single-use; the next button gets a fresh one

    catch (e) { Object.assign(Sync.auth, { busy: false, msgErr: true, msg: "Google sign-in didn't complete: " + Sync.message(e) }); }
    render();
  },
};

  "export-download": () => {

  import: () => openModal({ type: "import", text: "" }),
  "import-reset": () => { UI.modal = { type: "import", text: "" }; render(); },
  "import-check": () => {

  "import-apply": () => { const m = UI.modal; applyImport(m.ready.plan, m.withSettings, m.bundle.settings); closeModal(); toast(`Imported ${m.ready.pv.newWorks} new titles`); },
  wipe: () => openModal({ type: "confirm", title: "Delete all your data?", danger: true, ok: "Delete everything", okDisabled: true, wipe: true,
    body: `<p style="margin:0">Your library, watch history, ratings, notes and manual titles will be deleted. This can't be undone.</p>
      <div class="field"><label for="wipe-t">Type DELETE to confirm</label><input id="wipe-t" class="input" data-input="wipe-t" autocomplete="off"></div>`,
    onOk: () => {

  scrim: (d, el, ev) => { if (ev.target === el) closeModal(); },

function bulkConfirm(id, title, plan) {
  const body = (inc) => `<p style="margin:0"><b class="num">${plan.mark.length + (inc ? plan.unknown.length : 0)}</b> episodes will be marked watched.</p>
    ${plan.already ? `<p class="small muted" style="margin:0">${plan.already} already watched stay as they are.</p>` : ""}

  const m = { type: "confirm", title, body: body(false), ok: "Mark watched", plan, inc: false, bodyFn: body, okDisabled: !plan.mark.length && !plan.unknown.length,
    onOk: () => {

    } };

}

// ---------- events ----------
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el) { if (UI.menu && !ev.target.closest(".menu")) { UI.menu = null; render(); } return; }
  const fn = act[el.dataset.act];
  if (fn) { if (el.dataset.act !== "scrim") ev.preventDefault(); fn(el.dataset, el, ev); }
});
document.addEventListener("keydown", (ev) => {
  const m = UI.modal;
  if (m && m.type === "watch") {
    if (ev.key === "Escape" && m.cal.open) { ev.preventDefault(); m.cal.open = false; render(); document.getElementById("wd-toggle")?.focus(); return; }
    if (ev.key === "Enter" && ev.target.id === "wd-input") { ev.preventDefault(); commitTypedDate(m); render(); return; }
    if (ev.target.classList && ev.target.classList.contains("cal-day-btn")) {
      const iso = ev.target.dataset.d, [y, mo, d] = iso.split("-").map(Number), dt = new Date(y, mo - 1, d);
      const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[ev.key];
      let next = null;
      if (step) next = isoOf(new Date(y, mo - 1, d + step));
      else if (ev.key === "Home") next = isoOf(new Date(y, mo - 1, d - dt.getDay()));
      else if (ev.key === "End") next = isoOf(new Date(y, mo - 1, d + 6 - dt.getDay()));
      else if (ev.key === "PageUp" || ev.key === "PageDown") { const n = (ev.key === "PageUp" ? -1 : 1) * (ev.shiftKey ? 12 : 1); const t2 = new Date(y, mo - 1 + n, 1); next = isoOf(new Date(t2.getFullYear(), t2.getMonth(), Math.min(d, new Date(t2.getFullYear(), t2.getMonth() + 1, 0).getDate()))); }
      if (next) { ev.preventDefault(); calMove(m, next); return; }
    }
  }
  if (ev.key === "Escape") { if (UI.modal) closeModal(); else if (UI.menu) { UI.menu = null; render(); } else if (UI.detail) act.back(); }
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches('[role="button"][data-act]')) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener("input", (ev) => {
  const el = ev.target, k = el.dataset.input;
  if (!k) return;
  const m = UI.modal;
  if (k === "disc-q") { UI.disc.q = el.value; discoverReload(true); if (Catalog.status() !== "ready") render(); }
  else if (k === "lib-q") { UI.lib.q = el.value; render(); }
  else if (k === "lib-sort") { UI.lib.sort = el.value; render(); }
  else if (k === "mf") m.f[el.dataset.k] = el.value;
  else if (k === "link-q") { m.q = el.value; clearTimeout(linkTimer); linkTimer = setTimeout(linkSearch, 400); }
  else if (k === "mf-anime") m.f.isAnime = el.checked;
  else if (k === "wd-text") { m.dateText = el.value; }
  else if (k === "wd-re") m.rewatch = el.checked;
  else if (k === "src-other") { m.otherText = el.value; if (m.source && m.source.kind === "other") m.source.name = el.value; }
  else if (k === "ae-s") m.season = el.value;
  else if (k === "ae-c") m.count = el.value;
  else if (k === "ee-t") m.title = el.value;
  else if (k === "ee-d") m.date = el.value;
  else if (k === "df-year") m.f.year = el.value.replace(/\D/g, "").slice(0, 4);
  else if (k === "imp-text") { m.text = el.value; const b = document.querySelector('[data-act="import-check"]'); if (b) b.disabled = !m.text.trim(); }
  else if (k === "imp-settings") m.withSettings = el.checked;
  else if (k === "bulk-unknown") { m.inc = el.checked; m.body = m.bodyFn(m.inc); render(); }
  else if (k === "wipe-t") { const b = document.querySelector('[data-act="modal-ok"]'); if (b) b.disabled = el.value.trim() !== "DELETE"; m.okDisabled = el.value.trim() !== "DELETE"; }
});
document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.dataset.input === "wd-text" && UI.modal && UI.modal.type === "watch") {
    // Update the field in place: a full re-render here could swallow the click that caused the blur.
    const m = UI.modal, ok = commitTypedDate(m), hint = document.getElementById("wd-hint");
    if (ok) { el.value = m.date ? fmtDate(m.date) : ""; el.classList.remove("err"); el.removeAttribute("aria-invalid"); if (hint) { hint.className = "tiny muted"; hint.textContent = "Type a date like 20/11/2026 or 20 Nov 2026, or pick one."; } }
    else { el.classList.add("err"); el.setAttribute("aria-invalid", "true"); if (hint) { hint.className = "err-text"; hint.textContent = m.dateErr; } }
    return;
  }
  if (el.dataset.input === "lib-sort") { UI.lib.sort = el.value; render(); }
  if (el.dataset.actChange && act[el.dataset.actChange]) act[el.dataset.actChange](el.dataset, el);
  if (el.dataset.input === "imp-file" && el.files && el.files[0]) {
    const file = el.files[0];
    if (file.size > 20 * 1024 * 1024) { toast("That file is too large to be a ReelNest backup."); return; }
    file.text().then((text) => { UI.modal.text = text; act["import-check"](); }).catch(() => toast("Couldn't read that file."));
  }
});
document.addEventListener("focusout", (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.input === "notes") {
    const id = el.dataset.id, v = el.value.trim() || null;
    if (S.states[id] && (S.states[id].notes || null) !== v) { const u = setField(id, "notes", v); toast("Notes saved", () => { u(); render(); }); }
  }
});
// Discover tiles: a small 3D tilt that follows a mouse or trackpad pointer. Touch, pens and reduced-motion users get the static highlight.
let tiltEl = null, tiltRaf = 0;
const canTilt = () => matchMedia("(hover: hover) and (pointer: fine)").matches && !matchMedia("(prefers-reduced-motion: reduce)").matches;
const untilt = (el) => { if (!el) return; el.classList.remove("tilting"); el.style.removeProperty("--rx"); el.style.removeProperty("--ry"); };
document.addEventListener("pointermove", (ev) => {
  if (ev.pointerType !== "mouse" || !canTilt()) return;
  const t = ev.target.closest && ev.target.closest(".dtile");
  if (tiltEl && tiltEl !== t) { untilt(tiltEl); tiltEl = null; }
  if (!t) return;

  cancelAnimationFrame(tiltRaf);
  tiltRaf = requestAnimationFrame(() => {
    const r = t.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width - 0.5, y = (ev.clientY - r.top) / r.height - 0.5;
    t.classList.add("tilting");
    t.style.setProperty("--rx", (-y * 6).toFixed(2) + "deg"); t.style.setProperty("--ry", (x * 8).toFixed(2) + "deg");

}, { passive: true });
document.addEventListener("pointerout", (ev) => { if (tiltEl && !tiltEl.contains(ev.relatedTarget)) { cancelAnimationFrame(tiltRaf); untilt(tiltEl); tiltEl = null; } });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.some((t) => t[0] === h) && (h !== UI.tab || UI.detail)) go(h); });

// ---------- boot ----------
(function boot() {
  const h = location.hash.slice(1);
  if (TABS.some((t) => t[0] === h)) UI.tab = h;
  render();
  Persist.init().then(async () => {
    if ((storage.get("reelnest.tmdbKey") || storage.get("reelnest.tmdbRelay")) && !storage.get("reelnest.tmdbAt")) { storage.set("reelnest.tmdbAt", String(now())); Sync.markMeta(); }
    if (CloudCfg.configured()) { await Sync.consumeRedirect(); if (Sync.active()) Sync.run(); render(); }
  });
  if (UI.tab === "discover" && Catalog.status() === "ready") discoverReload(false);
  if (!IN_SANDBOX && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
